# NovaStudio bootstrap: HTTP only, used until Certbot has issued the
# certificate for novastudio.novaceptai.com. enable-https.sh replaces this with
# novastudio.novaceptai.com.conf.
server {
    listen 80;
    listen [::]:80;
    server_name novastudio.novaceptai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    root /var/www/novastudio;
    index index.html;

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location ~ /\. { deny all; }

    access_log /var/log/nginx/novastudio.access.log;
    error_log /var/log/nginx/novastudio.error.log;
}
