# NovaStudio — static Vite build served from /var/www/novastudio.
# Install only after Certbot has issued the novastudio certificate
# (deploy/enable-https.sh does both). Mirrors academy.novaceptai.com.
server {
    listen 80;
    listen [::]:80;
    server_name novastudio.novaceptai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://novastudio.novaceptai.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name novastudio.novaceptai.com;

    ssl_certificate /etc/letsencrypt/live/novastudio.novaceptai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novastudio.novaceptai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/novastudio;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    # Hashed build output never changes under the same name.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must revalidate so a deploy is picked up; the router handles
    # every other path client-side. No `$uri/`: a directory must never shadow
    # an app route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location ~ /\. { deny all; }

    access_log /var/log/nginx/novastudio.access.log;
    error_log /var/log/nginx/novastudio.error.log;
}
